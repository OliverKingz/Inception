services:
  # Database Service (MariaDB)
  # MariaDB service that will serve as the database backend for WordPress.
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    expose:
      - "3306"

  # Application Service (PHP-FPM 8.2)
  # FastCGI Process Manager for PHP 8.2, which will handle PHP requests from the NGINX reverse proxy.
  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    restart: unless-stopped
    depends_on:
      - mariadb
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network
    expose:
      - "9000"

  # Web Server Service (Reverse Proxy)
  # Reverse proxy service that forwards requests to the WordPress container.
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception_network

# Bridge Network
# Allows communication between the containers, isolated from the host network.
networks:
  inception_network:
    name: inception_network
    driver: bridge

# Volumes
# Allows data persistence even if the containers are removed or recreated.
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/ozamora-/data/mariadb'

  wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/ozamora-/data/wordpress'
